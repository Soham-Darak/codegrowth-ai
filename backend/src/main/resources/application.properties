spring.application.name=codegrowth-backend
server.port=8081

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:codegrowth}
spring.datasource.username=${POSTGRES_USER:codegrowth_user}
spring.datasource.password=${POSTGRES_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

codegrowth.ai.base-url=${AI_ENGINE_BASE_URL:http://localhost:8000}
codegrowth.jwt.secret=${JWT_SECRET:CodeGrowthLocalDevJwtSecretKeyMustBeAtLeast32CharsLong!}
codegrowth.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

management.endpoints.web.exposure.include=health,info

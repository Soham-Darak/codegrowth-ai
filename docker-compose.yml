services:

  postgres:
    image: postgres:17
    container_name: codegrowth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codegrowth-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: codegrowth-ollama
    restart: unless-stopped

    gpus: all

    ports:
      - "${OLLAMA_PORT}:11434"

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: codegrowth-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codegrowth-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-codegrowth}
      - POSTGRES_USER=${POSTGRES_USER:-codegrowth_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_ENGINE_BASE_URL=http://ai-engine:8000
      - JWT_SECRET=${JWT_SECRET:-CodeGrowthLocalDevJwtSecretKeyMustBeAtLeast32CharsLong!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codegrowth-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    depends_on:
      - backend

volumes:

  postgres_data:
    name: codegrowth-postgres-data

  redis_data:
    name: codegrowth-redis-data

  ollama_data:
    name: codegrowth-ollama-data